<a class="cs-saltar-contenido" href="#contenido-principal">Saltar al contenido</a>

<p-toolbar class="cs-barra-superior">
  <ng-template #start>
    <h1 class="cs-barra-superior__titulo">
      <!-- Logo oficial como imagen (D-38). Su texto alternativo da el nombre de la app. -->
      <img
        class="cs-barra-superior__logo"
        [src]="logo"
        alt="CatálogoStock"
        width="212"
        height="40"
      />
      <span class="cs-barra-superior__subtitulo">{{ subtitulo }}</span>
    </h1>
  </ng-template>
  <ng-template #end>
    <div class="cs-barra-superior__sesion">
      @if (nombreVendedor()) {
        <span class="cs-barra-superior__vendedor" data-prueba="nombre-vendedor">
          <i class="pi pi-user" aria-hidden="true"></i>
          {{ nombreVendedor() }}
        </span>
      }
      <p-button
        label="Cambiar mi clave"
        icon="pi pi-key"
        severity="secondary"
        [outlined]="true"
        data-prueba="cambiar-mi-clave"
        (onClick)="irACambiarClave()"
      />
      <p-button
        label="Cerrar sesión"
        icon="pi pi-sign-out"
        severity="secondary"
        [loading]="cerrando()"
        (onClick)="cerrarSesion()"
      />
    </div>
  </ng-template>
</p-toolbar>

<div class="cs-diseno">
  <nav class="cs-diseno__menu" aria-label="Secciones del panel">
    <p-menu [model]="secciones" class="cs-menu-lateral" />
  </nav>

  <main id="contenido-principal" class="cs-diseno__contenido" tabindex="-1">
    <router-outlet />
  </main>
</div>

<p-toast position="top-right" />
